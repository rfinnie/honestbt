# SPDX-PackageName: honestbt
# SPDX-PackageSupplier: Ryan Finnie <ryan@finnie.org>
# SPDX-PackageDownloadLocation: https://forge.colobox.com/rfinnie/honestbt
# SPDX-FileComment: pyproject configs
# SPDX-FileCopyrightText: © 2025 Ryan Finnie <ryan@finnie.org>
# SPDX-License-Identifier: MPL-2.0
[project]
name = "honestbt"
authors = [
    {name = "Ryan Finnie", email = "ryan@finnie.org"},
]
description = "Destructive tester which detects dishonest block devices"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = [
    "pycryptodomex",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=59.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = ["honestbt"]

[tool.setuptools.packages.find]
include = []

[tool.black]
line-length = 132
